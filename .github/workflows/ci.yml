name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: End-to-end tests (Chrome)
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Lint Firefox build
        run: npx --yes web-ext@8 lint --source-dir build/firefox
      - uses: actions/upload-artifact@v4
        with:
          name: tabwise-builds
          path: dist/*.zip
          retention-days: 14
